<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AI管理のTODO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231baf7a'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --wash: rgba(42,120,214,0.10);
    --s1: #2a78d6; --s2: #1baf7a; --s3: #c98500; --s4: #008300; --s5: #4a3aa7; --s6: #e34948; --s7: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --wash: rgba(57,135,229,0.14);
      --s1: #3987e5; --s2: #199e70; --s3: #c98500; --s4: #0ca30c; --s5: #9085e9; --s6: #e66767; --s7: #d55181;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
    font-size: 14px; line-height: 1.55; padding: 20px clamp(12px, 3vw, 36px) 48px; }
  main { max-width: 860px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 4px; }
  h1 { font-size: 19px; font-weight: 650; }
  .count { font-size: 13px; color: var(--ink-2); }
  .asof { margin-left: auto; font-size: 12px; color: var(--muted); }
  .lead { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filter { font: inherit; font-size: 12.5px; color: var(--ink-2); cursor: pointer; background: var(--surface);
    border: 1px solid var(--border); border-radius: 99px; padding: 3px 12px; }
  .filter b { font-weight: 600; margin-left: 2px; }
  .filter.on { color: var(--ink); background: var(--wash); border-color: var(--s1); }
  table { width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 8px 12px;
    border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th.sort { cursor: pointer; user-select: none; }
  th.sort::after { content: " ↕"; color: var(--muted); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.d, th.d { width: 7.5em; white-space: nowrap; }
  td.s, th.s { width: 7em; }
  .date { display: block; font-variant-numeric: tabular-nums; }
  .ago { display: block; font-size: 11.5px; color: var(--muted); }
  .note { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 9px; border-radius: 99px;
    border: 1px solid currentColor; white-space: nowrap; }
  .c1 { color: var(--s1); } .c2 { color: var(--s2); } .c3 { color: var(--s3); } .c4 { color: var(--s4); }
  .c5 { color: var(--s5); } .c6 { color: var(--s6); } .c7 { color: var(--s7); }
  .chip.unsorted { color: var(--muted); border-style: dashed; }
  tr.empty td { text-align: center; color: var(--muted); padding: 28px; }
  .recent { margin-top: 22px; }
  .recent summary { cursor: pointer; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  .recent td { color: var(--ink-2); }
  .st { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px;
    padding: 0 5px; margin-right: 6px; }
  .st-done { color: var(--s4); }
  .dest { font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) {
    td, th { padding: 8px 8px; }
    td.d, th.d { width: 5.6em; }
    td.s, th.s { width: 5.6em; }
  }
</style>
</head>
<body>
<main>
<header>
  <h1>AI管理のTODO</h1>
  <span class="count">未完了 7件</span>
  <span class="asof">最終更新 2026/10/16 15:38</span>
</header>
<p class="lead">日付を決めていない「やる必要があること」の一覧。Claude/Codexが更新しています。</p>
<div class="filters"><button class="filter on" data-f="">すべて <b>7</b></button><button class="filter" data-f="AI関連">AI関連 <b>1</b></button><button class="filter" data-f="ADMIN">ADMIN <b>1</b></button><button class="filter" data-f="投資">投資 <b>2</b></button><button class="filter" data-f="生活">生活 <b>3</b></button></div>
<table id="todo">
  <thead><tr><th class="d sort" data-k="d">登録日</th><th>タイトル</th><th class="s sort" data-k="s">セクション</th></tr></thead>
  <tbody><tr data-s="AI関連" data-d="2026-10-16T11:57:53+09:00" data-r="0"><td class="d"><span class="date">2026/10/16</span><span class="ago"></span></td><td class="t">LAN配信サイトの整理</td><td class="s"><span class="chip c1">AI関連</span></td></tr><tr data-s="ADMIN" data-d="2026-10-16T11:57:53+09:00" data-r="1"><td class="d"><span class="date">2026/10/16</span><span class="ago"></span></td><td class="t">不要サイトの登録内容変更</td><td class="s"><span class="chip c2">ADMIN</span></td></tr><tr data-s="投資" data-d="2026-10-16T11:57:53+09:00" data-r="2"><td class="d"><span class="date">2026/10/16</span><span class="ago"></span></td><td class="t">株の取引履歴の整備</td><td class="s"><span class="chip c3">投資</span></td></tr><tr data-s="投資" data-d="2026-10-16T11:57:53+09:00" data-r="2"><td class="d"><span class="date">2026/10/16</span><span class="ago"></span></td><td class="t">クリプトの取引履歴の整備</td><td class="s"><span class="chip c3">投資</span></td></tr><tr data-s="生活" data-d="2026-10-16T11:57:53+09:00" data-r="6"><td class="d"><span class="date">2026/10/16</span><span class="ago"></span></td><td class="t">歯医者のリスケ</td><td class="s"><span class="chip c7">生活</span></td></tr><tr data-s="生活" data-d="2026-10-16T11:57:53+09:00" data-r="6"><td class="d"><span class="date">2026/10/16</span><span class="ago"></span></td><td class="t">時計の選定</td><td class="s"><span class="chip c7">生活</span></td></tr><tr data-s="生活" data-d="2026-10-16T11:57:53+09:00" data-r="6"><td class="d"><span class="date">2026/10/16</span><span class="ago"></span></td><td class="t">秋服の選定</td><td class="s"><span class="chip c7">生活</span></td></tr></tbody>
</table>

</main>
<script>
(() => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  document.querySelectorAll("#todo tr[data-d]").forEach(tr => {
    const d = new Date(tr.dataset.d.slice(0, 10) + "T00:00:00");
    const n = Math.round((today - d) / 86400000);
    tr.querySelector(".ago").textContent = n <= 0 ? "今日" : n + "日前";
  });
  const filters = document.querySelectorAll(".filter");
  filters.forEach(b => b.addEventListener("click", () => {
    filters.forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll("#todo tr[data-s]").forEach(tr => {
      tr.hidden = !!b.dataset.f && tr.dataset.s !== b.dataset.f;
    });
  }));
  const body = document.querySelector("#todo tbody");
  let dir = 1;
  document.querySelectorAll("#todo th.sort").forEach(th => th.addEventListener("click", () => {
    const rows = [...body.querySelectorAll("tr[data-d]")];
    if (th.dataset.k === "d") {
      dir = -dir;
      rows.sort((a, b) => dir * a.dataset.d.localeCompare(b.dataset.d));
    } else {
      rows.sort((a, b) => (a.dataset.r - b.dataset.r) || a.dataset.d.localeCompare(b.dataset.d));
    }
    rows.forEach(r => body.appendChild(r));
  }));
})();
</script>
</body>
</html>
